<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青春时光 · 胡氏家史</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
:root{
  --main:#ffc107;
  --light:#fff9dd;
  --text:#333;
  --gray:#666;
  --white:#fff;
}
body{background:#fffdf4;color:var(--text);line-height:1.7}
header{background:var(--white);box-shadow:0 2px 10px #00000012;position:sticky;top:0;z-index:99}
.container{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:28px;padding:12px 0}
.nav-row{display:flex;gap:12px;flex-wrap:wrap;padding-bottom:12px}
.nav-row a{display:inline-block;padding:8px 14px;background:var(--light);color:var(--text);border-radius:6px;text-decoration:none}
.nav-row a.active{background:var(--main);color:#222;font-weight:bold}
.section{display:none;padding:16px 0}
.section.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:10px}
.card{background:var(--white);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #00000010}
.card-body{padding:14px}
.card-body h3{margin-bottom:6px}
.article{max-width:800px;line-height:1.8}
footer{margin-top:40px;padding:20px 0;text-align:center;color:var(--gray)}

.dropdown-btn{
  border:none;
  background:transparent;
  font-size:18px;
  cursor:pointer;
  color:var(--main);
  margin-left:8px;
}
.dropdown-content{
  display:none;
  margin-top:12px;
}
.dropdown-content.show{
  display:block;
}

/* 文件夹样式 */
.folder-item{
  background:var(--light);
  padding:12px 16px;
  border-radius:8px;
  margin:8px 0;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
}
.folder-item::before{
  content:"📁";
  font-size:20px;
}
.folder-item.open::before{
  content:"📂";
}
.folder-img-group{
  display:none;
  padding:12px 0 12px 30px;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
}
.folder-img-group.show{
  display:grid;
}

/* 图片放大弹窗 */
.img-modal{
  display:none;
  position:fixed;
  z-index:9999;
  left:0;top:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  align-items:center;
  justify-content:center;
}
.modal-img{
  max-width:90%;
  max-height:90%;
}
.modal-close{
  position:absolute;
  top:16px;
  right:30px;
  color:white;
  font-size:36px;
  cursor:pointer;
}
.img-modal.show{
  display:flex;
}
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>青春时光 · 胡氏家史</h1>
    <div class="nav-row">
      <a href="#" data-target="album" class="active">相册</a>
      <a href="#" data-target="sport">运动</a>
      <a href="#" data-target="music">音乐</a>
      <a href="#" data-target="travel">旅行</a>
      <a href="#" data-target="read">阅读</a>
      <a href="#" data-target="fun">娱乐</a>
      <a href="#" data-target="family">家史</a>
      <a href="#" data-target="video">视频</a>
      <a href="#" data-target="other">其他</a>
    </div>
  </div>
</header>
<div class="container">
<!-- 相册 -->
<div class="section" id="album">
  <h2>相册 <button class="dropdown-btn">▼</button></h2>
  <div class="dropdown-content">
    <div class="folder-item">文件夹1</div>
    <div class="folder-img-group"></div>
    <div class="folder-item">文件夹2</div>
    <div class="folder-img-group"></div>
    <div class="folder-item">文件夹3</div>
    <div class="folder-img-group"></div>
  </div>
</div>
<!-- 运动 -->
<div class="section" id="sport">
  <h2>运动 <button class="dropdown-btn">▼</button></h2>
  <div class="dropdown-content">
    <div class="folder-item">文件夹1</div>
    <div class="folder-img-group"></div>
    <div class="folder-item">文件夹2</div>
    <div class="folder-img-group"></div>
    <div class="folder-item">文件夹3</div>
  </div>
</div>
<!-- 音乐 -->
<div class="section" id="music">
  <h2>音乐 <button class="dropdown-btn">▼</button></h2>
  <div class="dropdown-content">
    <div class="folder-item">文件夹1</div>
    <div class="folder-img-group"></div>
    <div class="folder-item">文件夹2</div>
    <div class="folder-img-group"></div>
  </div>
</div>
<!-- 旅行 -->
<div class="section" id="travel">
  <h2>旅行 <button class="dropdown-btn">▼</button></h2>
  <div class="dropdown-content">
    <div class="folder-item">文件夹1</div>
    <div class="folder-img-group"></div>
    <div class="folder-item">文件夹2</div>
    <div class="folder-img-group"></div>
  </div>
</div>
<!-- 阅读 -->
<div class="section" id="read">
  <h2>阅读 <button class="dropdown-btn">▼</button></h2>
  <div class="dropdown-content">
    <div class="folder-item">文件夹1</div>
    <div class="folder-img-group"></div>
    <div class="folder-item">文件夹2</div>
    <div class="folder-img-group"></div>
  </div>
</div>
<!-- 娱乐 -->
<div class="section" id="fun">
  <h2>娱乐 <button class="dropdown-btn">▼</button></h2>
  <div class="dropdown-content">
    <div class="folder-item">文件夹1</div>

    <div class="folder-item">文件夹2</div>

  </div>
</div>
<!-- 家史 -->
<div class="section" id="family">

  <div class="dropdown-content">
    <div class="folder-item">文件夹1</div>
    <div class="folder-img-group"></div>
    <div class="folder-item">文件夹2</div>
    <div class="folder-img-group"></div>
  </div>
</div>
<!-- 视频 -->
<div class="section" id="video">

</div>
<!-- 其他 -->
<div class="section" id="other">
  <h2>其他 <button class="dropdown-btn">▼</button></h2>
  <div class="dropdown-content">
    <div class="folder-item">文件夹1</div>
    <div class="folder-img-group"></div>
    <div class="folder-item">文件夹2</div>
    <div class="folder-img-group"></div>
  </div>
</div>

<div class="img-modal" id="imgModal">
  <span class="modal-close">×</span>
  <img class="modal-img" id="modalImg">
</div>
</div>

<footer>© 2026 青春风采 活力无限<br>@HJS20261110</footer>

<script>
const links = document.querySelectorAll('.nav-row a');
const sections = document.querySelectorAll('.section');
links.forEach(link=>{
  link.onclick = function(e){
    e.preventDefault();
    const target = this.dataset.target;
    links.forEach(l=>l.classList.remove('active'));
    this.classList.add('active');
    sections.forEach(s=>s.classList.remove('show'));
    document.getElementById(target).classList.add('show');
  }
})

const dropBtns = document.querySelectorAll('.dropdown-btn');
dropBtns.forEach(btn=>{
  btn.onclick = function(){
    const content = this.parentElement.nextElementSibling;
    content.classList.toggle('show');
    this.textContent = content.classList.contains('show') ? '▲' : '▼';
  }
})

const folders = document.querySelectorAll('.folder-item');
folders.forEach(folder=>{
  folder.onclick = function(){
    const imgGroup = this.nextElementSibling;
    imgGroup.classList.toggle('show');
    this.classList.toggle('open');
  }
})

const modal = document.getElementById('imgModal');
const modalImg = document.getElementById('modalImg');
const closeBtn = document.querySelector('.modal-close');
document.addEventListener('click', function(e){
  if(e.target.classList.contains('zoom-img')){
    modalImg.src = e.target.src;
    modal.classList.add('show');
  }
})
closeBtn.onclick = ()=> modal.classList.remove('show');
modal.onclick = (e)=>{
  if(e.target === modal) modal.classList.remove('show');
}
</script>
</body>
</html>
