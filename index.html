<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青春风采 活力无限</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
:root{
  --main:#ffc107;
  --light:#fff9dd;
  --text:#333;
  --gray:#666;
  --white:#fff;
}
body{background:#fffdf4;color:var(--text);line-height:1.7}
header{background:var(--white);z-index:99;}
.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
}
.top-title{
  font-size:26px;
  color:var(--main);
  font-weight:bold;
}
.avatar-wrap{
  text-align:center;
}
.avatar-img{
  width:140px;
  display:block;
  margin:0 auto;
}
.avatar-name{
  font-size:24px;
  font-weight:bold;
  margin-top:4px;
  color:#222;
}
.nav-row{display:flex;gap:4px;flex-wrap:wrap;padding:0 20px 12px}
.nav-row a{display:inline-block;padding:8px 16px;border-radius:6px;text-decoration:none;color:#333;font-size:18px}
.nav-row a.active{background:var(--main);color:#222;font-weight:bold}

.banner{
  width:100%;
  background:linear-gradient(90deg,#fff2b0,#ffd02b);
  padding:60px 20px;
  text-align:center;
}
.banner h2{
  font-size:42px;
  color:#222;
}

.container{max-width:1100px;margin:0 auto;padding:20px}
.section{display:none}
.section.show{display:block}
.section-header{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:32px;
  border-left:5px solid var(--main);
  padding-left:12px;
  margin-bottom:12px;
}
.section-title{
  font-size:32px;
}
.triangle{
  font-size:28px;
  color:var(--main);
  cursor:pointer;
  transition:transform 0.2s;
}
.triangle.open{
  transform:rotate(180deg);
}
.dropdown-content{
  display:none;
  margin-top:12px;
  padding-left:17px;
}
.dropdown-content.show{
  display:block;
}
.folder-item{
  background:var(--light);
  padding:14px 18px;
  border-radius:10px;
  margin:10px 0;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
}
.folder-item::before{
  content:"📁";
  font-size:24px;
}
.folder-item.open::before{
  content:"📂";
}
.photo-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
  gap:14px;
  padding:14px 0 14px 36px;
  display:none;
}
.photo-grid.show{
  display:grid;
}
.photo-grid img, .photo-grid .video-thumb{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
}
.video-thumb{
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:40px;
}
footer{margin-top:40px;padding:20px 0;text-align:center;color:var(--gray)}

/* 图片弹窗 */
.img-modal{
  display:none;
  position:fixed;
  z-index:999999;
  left:0;top:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  align-items:center;
  justify-content:center;
}
.img-modal.show{
  display:flex;
}
.modal-img{
  max-width:90%;
  max-height:90%;
  border-radius:8px;
}
.modal-close{
  position:absolute;
  top:20px;
  right:30px;
  color:white;
  font-size:40px;
  font-weight:bold;
  cursor:pointer;
  z-index:9999999;
}
.modal-close:hover{
  color:var(--main);
}

/* 视频弹窗 */
.video-modal{
  display:none;
  position:fixed;
  z-index:999999;
  left:0;top:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.92);
  align-items:center;
  justify-content:center;
  padding:20px;
}
.video-modal.show{
  display:flex;
}
.video-modal video{
  max-width:90%;
  max-height:90%;
  border-radius:8px;
}
</style>
</head>
<body>
<header>
  <div class="top-row">
    <div class="top-title">青春风采 活力无限</div>
    <div class="avatar-wrap">
      <img class="avatar-img zoom-img" src="avatar.jpg" alt="胡劲松">
      <div class="avatar-name">胡劲松</div>
    </div>
  </div>
  <div class="nav-row">
    <a href="#" data-target="home" class="active">首页</a>
    <a href="#" data-target="album">相册</a>
    <a href="#" data-target="sport">运动</a>
    <a href="#" data-target="music">音乐</a>
    <a href="#" data-target="travel">旅行</a>
    <a href="#" data-target="read">阅读</a>
    <a href="#" data-target="fun">娱乐</a>
    <a href="#" data-target="family">家史</a>
    <a href="#" data-target="video">视频</a>
    <a href="#" data-target="other">其他</a>
  </div>
</header>

<div class="banner">
  <h2>致永不消逝的青春</h2>
</div>

<div class="container">

<div class="section show" id="home">
  <div class="section-header">
    <div class="section-title">首页</div>
    <span class="triangle">▼</span>
  </div>
  <div class="dropdown-content">
    <p>轻松的休闲时刻，记录生活点滴。</p>
  </div>
</div>

<div class="section" id="album">
  <div class="section-header">
    <div class="section-title">相册</div>
    <span class="triangle">▼</span>
  </div>
  <div class="dropdown-content">
    <div class="folder-item">家庭合影</div>
    <div class="photo-grid">
      <img src="family-old-photo/old01.jpg" class="zoom-img">
    </div>
    <div class="folder-item">旅行照片</div>
    <div class="photo-grid"></div>
    <div class="folder-item">生活随拍</div>
    <div class="photo-grid"></div>
  </div>
</div>

<div class="section" id="sport">
  <div class="section-header">
    <div class="section-title">运动</div>
    <span class="triangle">▼</span>
  </div>
  <div class="dropdown-content">
    <div class="folder-item">跑步记录</div>
    <div class="photo-grid"></div>
    <div class="folder-item">球类运动</div>
    <div class="photo-grid"></div>
    <div class="folder-item">健身打卡</div>
    <div class="photo-grid"></div>
  </div>
</div>

<div class="section" id="music">
  <div class="section-header">
    <div class="section-title">音乐</div>
    <span class="triangle">▼</span>
  </div>
  <div class="dropdown-content">
    <div class="folder-item">吉他弹唱</div>
    <div class="photo-grid"></div>
    <div class="folder-item">听歌记录</div>
    <div class="photo-grid"></div>
    <div class="folder-item">演出照片</div>
    <div class="photo-grid"></div>
  </div>
</div>

<div class="section" id="travel">
  <div class="section-header">
    <div class="section-title">旅行</div>
    <span class="triangle">▼</span>
  </div>
  <div class="dropdown-content">
    <div class="folder-item">游记照片</div>
    <div class="photo-grid"></div>
    <div class="folder-item">旅途见闻</div>
    <div class="photo-grid"></div>
  </div>
</div>

<div class="section" id="read">
  <div class="section-header">
    <div class="section-title">阅读</div>
    <span class="triangle">▼</span>
  </div>
  <div class="dropdown-content">
    <div class="folder-item">读书笔记</div>
    <div class="photo-grid"></div>
    <div class="folder-item">推荐书单</div>
    <div class="photo-grid"></div>
  </div>
</div>

<div class="section" id="fun">
  <div class="section-header">
    <div class="section-title">娱乐</div>
    <span class="triangle">▼</span>
  </div>
  <div class="dropdown-content">
    <div class="folder-item">电影追剧</div>
    <div class="photo-grid"></div>
    <div class="folder-item">趣味视频</div>
    <div class="photo-grid"></div>
  </div>
</div>

<div class="section" id="family">
  <div class="section-header">
    <div class="section-title">家史</div>
    <span class="triangle">▼</span>
  </div>
  <div class="dropdown-content">
    <div class="folder-item">胡氏源流</div>
    <div class="photo-grid"></div>
    <div class="folder-item">家族老照片</div>
    <div class="photo-grid">
      <img src="family-old-photo/old01.jpg" class="zoom-img">
      <img src="family-old-photo/old02.jpg" class="zoom-img">
      <img src="family-old-photo/old03.png" class="zoom-img">
      <img src="family-old-photo/old04.jpg" class="zoom-img">
    </div>
    <div class="folder-item">胡氏短剧</div>
    <div class="photo-grid">
      <!-- 视频缩略，点击播放弹窗 -->
      <div class="video-thumb" data-video="hushi-drama/drama01.mp4">▶</div>
      <div class="video-thumb" data-video="hushi-drama/drama02.mp4">▶</div>
    </div>
  </div>
</div>

<div class="section" id="video">
  <div class="section-header">
    <div class="section-title">视频</div>
    <span class="triangle">▼</span>
  </div>
  <div class="dropdown-content">
    <div class="folder-item">生活短视频</div>
    <div class="photo-grid"></div>
    <div class="folder-item">旅行视频</div>
    <div class="photo-grid"></div>
  </div>
</div>

<div class="section" id="other">
  <div class="section-header">
    <div class="section-title">其他</div>
    <span class="triangle">▼</span>
  </div>
  <div class="dropdown-content">
    <div class="folder-item">随手记录</div>
    <div class="photo-grid"></div>
    <div class="folder-item">留言相册</div>
    <div class="photo-grid"></div>
  </div>
</div>

</div>

<!-- 图片弹窗 -->
<div class="img-modal" id="imgModal">
  <span class="modal-close" id="modalClose">×</span>
  <img class="modal-img" id="modalImg">
</div>

<!-- 视频弹窗 -->
<div class="video-modal" id="videoModal">
  <span class="modal-close" id="videoClose">×</span>
  <video id="videoPlayer" controls></video>
</div>

<footer>© 2026 青春风采 活力无限<br>@HJS20261110</footer>

<script>
const links = document.querySelectorAll('.nav-row a');
const sections = document.querySelectorAll('.section');

links.forEach(link=>{
  link.onclick = function(e){
    e.preventDefault();
    const target = this.dataset.target;
    links.forEach(l=>l.classList.remove('active'));
    this.classList.add('active');
    sections.forEach(s=>s.classList.remove('show'));
    document.getElementById(target).classList.add('show');
  }
})

const triangles = document.querySelectorAll('.triangle');
triangles.forEach(tri=>{
  tri.onclick = function(){
    const content = this.closest('.section-header').nextElementSibling;
    content.classList.toggle('show');
    this.classList.toggle('open');
  }
})

const folderItems = document.querySelectorAll('.folder-item');
folderItems.forEach(item=>{
  item.onclick = function(){
    const grid = this.nextElementSibling;
    grid.classList.toggle('show');
    this.classList.toggle('open');
  }
})

// 图片放大
const modal = document.getElementById('imgModal');
const modalImg = document.getElementById('modalImg');
const modalClose = document.getElementById('modalClose');
document.querySelectorAll('.zoom-img').forEach(img=>{
  img.addEventListener('click', function(e){
    e.stopPropagation();
    modalImg.src = this.src;
    modal.classList.add('show');
  });
});
modalClose.addEventListener('click', ()=> modal.classList.remove('show'));
modal.addEventListener('click', function(e){
  if(e.target === modal) modal.classList.remove('show');
});

// 视频弹窗播放
const videoModal = document.getElementById('videoModal');
const videoPlayer = document.getElementById('videoPlayer');
const videoClose = document.getElementById('videoClose');
document.querySelectorAll('.video-thumb').forEach(thumb=>{
  thumb.onclick = function(){
    const src = this.dataset.video;
    videoPlayer.src = src;
    videoModal.classList.add('show');
    videoPlayer.play();
  }
})
videoClose.onclick = ()=>{
  videoPlayer.pause();
  videoModal.classList.remove('show');
}
videoModal.onclick = function(e){
  if(e.target === videoModal){
    videoPlayer.pause();
    videoModal.classList.remove('show');
  }
}
</script>
</body>
</html>
