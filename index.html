<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青春时光 · 胡氏家史</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
:root{
  --main:#ffc107;
  --light:#fff9dd;
  --text:#333;
  --gray:#666;
  --white:#fff;
}
body{background:#fffdf4;color:var(--text);line-height:1.7}
header{background:var(--white);box-shadow:0 2px 10px #00000012;position:sticky;top:0;z-index:99}
nav{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
.left-title{
  font-size:20px;
}
.nav-links a{display:inline-block;padding:10px 12px;text-decoration:none;color:#333;font-size:16px;}
.nav-links a.active{background-color:#ffc107;color:#fff;border-radius:8px;}
.user-info{text-align:center;}
.user-info img{width:48px;height:48px;border-radius:50%;object-fit:cover;}
.user-info p{margin-top:4px;}
.banner{background:linear-gradient(90deg,#ffe470,#ffc107);height:320px;display:flex;align-items:center;justify-content:center;}
.banner h1{font-size:46px;color:#222;}
.container{padding:40px 30px;max-width:1200px;margin:0 auto;}
.title-line{display:flex;align-items:center;margin-bottom:20px;}
.line{width:6px;height:32px;background-color:#ffc107;margin-right:12px;}
.title-line h2{font-size:28px;color:#333;}
.content p{font-size:18px;color:#444;line-height:1.8;}
.section{display:none;}
.section.show{display:block;}
</style>
</head>
<body>
<header>
  <nav>
    <div class="left-title">青春风采 活力无限</div>
    <div class="nav-links">
      <a href="#" class="active" data-target="home">首页</a>
      <a href="#" data-target="album">相册</a>
      <a href="#" data-target="sport">运动</a>
      <a href="#" data-target="music">音乐</a>
      <a href="#" data-target="travel">旅行</a>
      <a href="#" data-target="read">阅读</a>
      <a href="#" data-target="fun">娱乐</a>
      <a href="#" data-target="family">家史</a>
      <a href="#" data-target="video">视频</a>
      <a href="#" data-target="other">其他</a>
    </div>
    <div class="user-info">
      <img src="avatar.jpg" alt="头像">
      <p>胡劲松</p>
    </div>
  </nav>
</header>
<section class="banner">
  <h1>致永不消逝的青春</h1>
</section>
<div class="container">
  <div id="home" class="section show">
    <div class="title-line">
      <div class="line"></div>
      <h2>首页</h2>
    </div>
    <div class="content">
      <p>轻松的休闲时刻，记录生活点滴。</p>
    </div>
  </div>
  <div id="album" class="section">
    <div class="title-line">
      <div class="line"></div>
      <h2>相册</h2>
    </div>
    <div class="content">
      <p>照片相册，留存美好瞬间。</p>
    </div>
  </div>
  <div id="sport" class="section">
    <div class="title-line">
      <div class="line"></div>
      <h2>运动</h2>
    </div>
    <div class="content">
      <p>运动记录，活力常在。</p>
    </div>
  </div>
  <div id="music" class="section">
    <div class="title-line">
      <div class="line"></div>
      <h2>音乐</h2>
    </div>
    <div class="content">
      <p>喜欢的音乐，静心聆听。</p>
    </div>
  </div>
  <div id="travel" class="section">
    <div class="title-line">
      <div class="line"></div>
      <h2>旅行</h2>
    </div>
    <div class="content">
      <p>旅途见闻，山河风光。</p>
    </div>
  </div>
  <div id="read" class="section">
    <div class="title-line">
      <div class="line"></div>
      <h2>阅读</h2>
    </div>
    <div class="content">
      <p>读书心得，文字感悟。</p>
    </div>
  </div>
  <div id="fun" class="section">
    <div class="title-line">
      <div class="line"></div>
      <h2>娱乐</h2>
    </div>
    <div class="content">
      <p>休闲娱乐，自在时光。</p>
    </div>
  </div>
  <div id="family" class="section">
    <div class="title-line">
      <div class="line"></div>
      <h2>家史</h2>
    </div>
    <div class="content">
      <p>胡氏家风，家族故事。</p>
    </div>
  </div>
  <div id="video" class="section">
    <div class="title-line">
      <div class="line"></div>
      <h2>视频</h2>
    </div>
    <div class="content">
      <p>影像记录，短视频合集。</p>
    </div>
  </div>
  <div id="other" class="section">
    <div class="title-line">
      <div class="line"></div>
      <h2>其他</h2>
    </div>
    <div class="content">
      <p>其他内容。</p>
    </div>
  </div>
</div>
<footer>© 2026 青春风采 活力无限</footer>

<script>
const links = document.querySelectorAll('.nav-links a');
const sections = document.querySelectorAll('.section');
links.forEach(link=>{
  link.onclick=e=>{
    e.preventDefault();
    const targetId = link.dataset.target;
    links.forEach(l=>l.classList.remove('active'));
    link.classList.add('active');
    sections.forEach(s=>s.classList.remove('show'));
    setTimeout(()=>{
      document.getElementById(targetId).classList.add('show');
    },50)
  }
})
</script>
</body>
</html>
