<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青春时光 · 胡氏家史</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
:root{
  --main:#ffc107;
  --text:#333;
  --bg:#fffdf0;
}
body{background-color:var(--bg);color:var(--text);line-height:1.7}
header{background:#fff;padding:12px 24px;box-shadow:0 2px 8px rgba(0,0,0,0.08);position:sticky;top:0;z-index:99}
.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:26px;
  color:var(--main);
  font-weight:bold;
}
.user-box{
  text-align:center;
}
.user-box img{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
}
.user-box p{
  margin-top:4px;
}
.nav-row{
  margin-top:10px;
}
.nav-row a{
  display:inline-block;
  padding:8px 14px;
  text-decoration:none;
  color:#333;
  font-size:16px;
  border-radius:8px;
}
.nav-row a.active{
  background-color:var(--main);
  color:#fff;
}
.banner{
  background:linear-gradient(90deg,#ffe670,var(--main));
  height:320px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.banner h1{
  font-size:48px;
  color:#222;
}
.container{
  max-width:1200px;
  margin:0 auto;
  padding:40px 30px;
}
.title-line{
  display:flex;
  align-items:center;
  margin-bottom:20px;
}
.line-mark{
  width:6px;
  height:32px;
  background:var(--main);
  margin-right:12px;
}
.title-line h2{
  font-size:28px;
}
.content p{
  font-size:18px;
  color:#444;
}
.section{
  display:none;
}
.section.show{
  display:block;
}
footer{
  text-align:center;
  padding:20px;
  font-size:14px;
  color:#666;
}
</style>
</head>
<body>
<header>
  <div class="top-row">
    <div class="logo">青春风采 活力无限</div>
    <div class="user-box">
      <img src="avatar.jpg" alt="头像">
      <p>胡劲松</p>
    </div>
  </div>
  <div class="nav-row">
    <a href="#" class="active" data-target="home">首页</a>
    <a href="#" data-target="album">相册</a>
    <a href="#" data-target="sport">运动</a>
    <a href="#" data-target="music">音乐</a>
    <a href="#" data-target="travel">旅行</a>
    <a href="#" data-target="read">阅读</a>
    <a href="#" data-target="fun">娱乐</a>
    <a href="#" data-target="family">家史</a>
    <a href="#" data-target="video">视频</a>
    <a href="#" data-target="other">其他</a>
  </div>
</header>
<section class="banner">
  <h1>致永不消逝的青春</h1>
</section>
<div class="container">
  <div id="home" class="section show">
    <div class="title-line">
      <div class="line-mark"></div>
      <h2>首页</h2>
    </div>
    <div class="content">
      <p>轻松的休闲时刻，记录生活点滴。</p>
    </div>
  </div>
  <div id="album" class="section">
    <div class="title-line">
      <div class="line-mark"></div>
      <h2>相册</h2>
    </div>
    <div class="content">
      <p>照片相册，留存美好瞬间。</p>
    </div>
  </div>
  <div id="sport" class="section">
    <div class="title-line">
      <div class="line-mark"></div>
      <h2>运动</h2>
    </div>
    <div class="content">
      <p>坚持运动，保持活力。</p>
    </div>
  </div>
  <div id="music" class="section">
    <div class="title-line">
      <div class="line-mark"></div>
      <h2>音乐</h2>
    </div>
    <div class="content">
      <p>聆听音乐，治愈心情。</p>
    </div>
  </div>
  <div id="travel" class="section">
    <div class="title-line">
      <div class="line-mark"></div>
      <h2>旅行</h2>
    </div>
    <div class="content">
      <p>走遍山河，看世间风景。</p>
    </div>
  </div>
  <div id="read" class="section">
    <div class="title-line">
      <div class="line-mark"></div>
      <h2>阅读</h2>
    </div>
    <div class="content">
      <p>静心阅读，沉淀自我。</p>
    </div>
  </div>
  <div id="fun" class="section">
    <div class="title-line">
      <div class="line-mark"></div>
      <h2>娱乐</h2>
    </div>
    <div class="content">
      <p>闲暇时光，放松身心。</p>
    </div>
  </div>
  <div id="family" class="section">
    <div class="title-line">
      <div class="line-mark"></div>
      <h2>家史</h2>
    </div>
    <div class="content">
      <p>胡氏家风，家族故事。</p>
    </div>
  </div>
  <div id="video" class="section">
    <div class="title-line">
      <div class="line-mark"></div>
      <h2>视频</h2>
    </div>
    <div class="content">
      <p>影像记录，留住时光。</p>
    </div>
  </div>
  <div id="other" class="section">
    <div class="title-line">
      <div class="line-mark"></div>
      <h2>其他</h2>
    </div>
    <div class="content">
      <p>其他内容。</p>
    </div>
  </div>
</div>
<footer>© 2026 青春风采 活力无限<br>@HJS20261110</footer>
<script>
const links = document.querySelectorAll('.nav-row a');
const sections = document.querySelectorAll('.section');
links.forEach(link=>{
  link.onclick = function(e){
    e.preventDefault();
    const target = this.dataset.target;
    links.forEach(l=>l.classList.remove('active'));
    this.classList.add('active');
    sections.forEach(s=>s.classList.remove('show'));
    document.getElementById(target).classList.add('show');
  }
})
</script>
</body>
</html>
